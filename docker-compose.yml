services:
  backend:
    build:
      context: ./backend
    container_name: nacer-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      # Optional. Provide a token to raise the GitHub rate limit.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time. Must be the URL the
        # browser uses to reach the backend on the host, not the internal
        # Docker service hostname.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: nacer-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
